server.servlet.context-path=/my_app

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/my_app_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aglaya}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MY_APP_DB_PASSWORD}}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true